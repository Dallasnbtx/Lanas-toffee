<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{% block title %}{{ cfg.business_name }}{% endblock %}</title><meta name="theme-color" content="#1A0E07">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Serif+Display:ital@0;1&family=Great+Vibes&family=Lato:wght@300;400;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='classy.css') }}"></head><body class="{% block bodyclass %}{% endblock %}">
<header class="mast"><a href="/" class="brand">{{ cfg.business_name }}</a>
  <div class="orn" aria-hidden="true"><span></span><i></i><span></span></div>
  <div class="kicker">small-batch &nbsp;·&nbsp; handmade in New Braunfels</div></header>
{% block body %}{% endblock %}
<div class="bezel" id="bezel" aria-hidden="true"><div class="bz-glow"></div><div class="bz-boost"></div>
  <svg class="bz-trails" id="bz-trails" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="bzg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FBEBB5"/><stop offset=".5" stop-color="#E7C27A"/><stop offset="1" stop-color="#F3D58E"/></linearGradient></defs>
    <rect class="tl t1"/><rect class="tl t2"/><rect class="tl t3"/><rect class="tl t4"/></svg>
  <i class="sp s1"></i><i class="sp s2"></i><i class="sp s3"></i><i class="sp s4"></i><i class="sp s5"></i><i class="sp s6"></i><i class="sp s7"></i><i class="sp s8"></i><i class="sp s9"></i><i class="sp s10"></i></div>
<script src="{{ url_for('static', filename='bezel.js') }}" defer></script>
</body></html>
